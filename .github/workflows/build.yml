name: Build and Release
on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Set version
        run: echo "VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Build APK
        run: gradle assembleDebug --no-daemon -PappVersionName=$VERSION -PappVersionCode=${{ github.run_number }}
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Achievements-v$VERSION.apk"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Achievements v${{ env.VERSION }}
          generate_release_notes: true
          files: Achievements-v${{ env.VERSION }}.apk
