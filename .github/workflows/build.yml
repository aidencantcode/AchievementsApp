name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Fetch Inter font (optional, app falls back to system font)
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -L --fail -o app/src/main/assets/fonts/Inter.ttf "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf" || rm -f app/src/main/assets/fonts/Inter.ttf
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Achievements-debug-apk
          path: app/build/outputs/apk/debug/*.apk
